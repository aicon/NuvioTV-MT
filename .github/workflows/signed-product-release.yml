name: Product release

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "badges/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Bump the group suffix if a zombie run ever sticks the queue (cancel-in-progress cannot clear it).
  group: product-release-${{ github.ref }}-v2
  cancel-in-progress: true

jobs:
  release:
    name: Signed release for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -eu
          gradle_file=app/build.gradle.kts
          version_lines="$(grep -E '^[[:space:]]*versionName[[:space:]]*=' "${gradle_file}" || true)"
          code_lines="$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' "${gradle_file}" || true)"
          version_count="$(printf '%s\n' "${version_lines}" | grep -c . || true)"
          code_count="$(printf '%s\n' "${code_lines}" | grep -c . || true)"
          if [[ "${version_count}" -ne 1 || "${code_count}" -ne 1 ]]; then
            echo "Expected exactly one versionName and one versionCode in ${gradle_file} (found versionName=${version_count}, versionCode=${code_count})." >&2
            echo "--- ${gradle_file} defaultConfig ---" >&2
            sed -n '/defaultConfig[[:space:]]*{/,/^[[:space:]]*}/p' "${gradle_file}" >&2 || true
            exit 1
          fi
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' "${gradle_file}")"
          code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' "${gradle_file}")"
          if [[ -z "${version}" || -z "${code}" ]]; then
            echo "Could not parse versionName/versionCode from ${gradle_file}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == "main" && "${version}" == *-* ]]; then
            echo "main must use a stable versionName (no beta/alpha suffix); got '${version}'." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == "dev" && "${version}" != *-* ]]; then
            echo "dev must use a prerelease versionName (e.g. 1.1.0-beta.N); got '${version}'." >&2
            exit 1
          fi
          prerelease=false
          if [[ "${GITHUB_REF_NAME}" == "dev" || "${version}" == *-* ]]; then
            prerelease=true
          fi
          if [[ "${GITHUB_REF_NAME}" == "main" && "${version}" != *-* ]]; then
            prerelease=false
          fi
          core="${version%%-*}"
          suffix=""
          title="${version}"
          if [[ "${version}" == *-* ]]; then
            suffix="${version#*-}"
          fi
          if [[ "${suffix}" == beta.* ]]; then
            title="Beta ${core} (${suffix#beta.})"
          elif [[ "${suffix}" == "beta" ]]; then
            title="Beta ${core}"
          fi
          exists=false
          if gh release view "${version}" >/dev/null 2>&1; then
            exists=true
            echo "Release ${version} already exists. Skipping the build."
          fi
          {
            echo "version=${version}"
            echo "code=${code}"
            echo "tag=${version}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
            echo "exists=${exists}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        if: steps.version.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.version.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: steps.version.outputs.exists != 'true'
        run: |
          set -eu
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" || -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "Missing NUVIO_RELEASE_KEYSTORE_BASE64 or LOCAL_PROPERTIES_BASE64." >&2
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/release.keystore"
          python3 - <<'PY'
          import base64, binascii, os, pathlib, sys
          raw = os.environ["RELEASE_KEYSTORE_BASE64"].strip().lstrip("\ufeff")
          b64 = "".join(raw.split())
          try:
              data = base64.b64decode(b64, validate=False)
          except binascii.Error as exc:
              print(f"Keystore Base64 decode failed: {exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release.keystore"
          path.write_bytes(data)
          if path.stat().st_size == 0:
              print("Keystore file is empty after decode.", file=sys.stderr)
              raise SystemExit(1)
          props = base64.b64decode("".join(os.environ["LOCAL_PROPERTIES_BASE64"].strip().split()))
          pathlib.Path("local.properties").write_bytes(props)
          dev = os.environ.get("LOCAL_DEV_PROPERTIES_BASE64", "").strip()
          if dev:
              pathlib.Path("local.dev.properties").write_bytes(base64.b64decode("".join(dev.split())))
          PY
          python3 - <<PY
          import os, pathlib, re
          path = pathlib.Path("local.properties")
          text = path.read_text(encoding="utf-8", errors="replace")
          lines = [
              line for line in text.splitlines()
              if not re.match(r"^\s*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_RELEASE_KEY_ALIAS|NUVIO_RELEASE_KEY_PASSWORD|NUVIO_RELEASE_STORE_PASSWORD)\s*=", line)
          ]
          values = {
              "NUVIO_RELEASE_STORE_FILE": os.environ["RUNNER_TEMP"] + "/release.keystore",
              "NUVIO_RELEASE_KEY_ALIAS": os.environ["RELEASE_KEY_ALIAS"],
              "NUVIO_RELEASE_KEY_PASSWORD": os.environ["RELEASE_KEY_PASSWORD"],
              "NUVIO_RELEASE_STORE_PASSWORD": os.environ["RELEASE_STORE_PASSWORD"],
          }
          for key, value in values.items():
              if not value:
                  print(f"Missing {key}.", file=__import__("sys").stderr)
                  raise SystemExit(1)
              lines.append(f"{key}={value}")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          keytool -list -keystore "${keystore_path}" -storepass "${RELEASE_STORE_PASSWORD}" >/dev/null

      - name: Build every ABI
        if: steps.version.outputs.exists != 'true'
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Write release notes
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -eu
          channel="Stable"
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            channel="Beta"
          fi
          {
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              printf '%s\n' \
                '> [!IMPORTANT]' \
                '> **Beta builds are for testing and may contain bugs or regressions.** For the regular install, use the Stable channel.' \
                ''
            fi
            echo "# ${RELEASE_TITLE}"
            echo
            echo "Signed NuvioTV-MT ${channel} build \`${RELEASE_VERSION}\` (versionCode \`${RELEASE_CODE}\`)."
            echo "This is a personal product fork of NuvioTV. It is not an official Nuvio build."
            echo
            echo "## Install"
            echo
            echo "- Package: \`com.aicon.nuviotv\`"
            echo "- The package id is different from official NuvioTV (\`com.nuvio.tv\`), so this APK installs beside it and does not replace it."
            echo "- Pick the APK that matches the device CPU. A universal APK is included for the other cases."
            echo "- \`armeabi-v7a\` for 32-bit Android TV"
            echo "- \`arm64-v8a\` for 64-bit phones and newer TVs"
            echo "- \`x86\` and \`x86_64\` for emulators"
            echo "- In-app updates read public releases from \`aicon/NuvioTV-MT\`. Stable builds come from \`main\`. Beta builds come from \`dev\`."
            echo
            echo "## What this fork adds"
            echo
            echo "- **MediaTrail playback.** While something is playing, the app sends \`start\`, \`pause\`, \`progress\`, and \`stop\` to installed addons that declare the Stremio \`player\` resource. Install the [MediaTrail](https://github.com/aicon/MediaTrail) addon (\`…/nuvio/manifest.json\`); each install sends a stable \`deviceId\` and a model-based \`deviceName\` so multiple TVs and the phone stay separate on Now Watching. Seek emits progress. Finished watches save at 90%. Progress is sent about every 30 seconds and not while paused. The switch is on by default under playback settings."
            echo "- **Player engine.** The default engine is Auto. Movies and ordinary TV use ExoPlayer. Anime (Kitsu, MAL, AniList, or an anime genre) uses libmpv. AVI and XviD use libmpv even when the saved engine is ExoPlayer, unless an engine was chosen for that playback. HDR and Dolby Vision stay on ExoPlayer."
            echo "- **Own update channel.** The built-in updater looks at this repository, not upstream NuvioTV."
            echo "- **Support.** The in-app support button and QR code open [Ko-fi](https://ko-fi.com/aiconwg)."
            echo "- **MediaTrail name.** The playback-events setting now says MediaTrail instead of Yamtrack."
            echo "- **Community lists.** The supporters, sponsors, and contributors lists stay hidden until this fork has its own list. The Ko-fi button and QR code stay."
            echo
            echo "The fork does not pause or resume the television from the MediaTrail page. Playback events go out to the addon. They do not come back as remote controls."
            echo
            echo "## Commits in this build"
            echo
            git log --no-merges --format='- %s' -n 25 HEAD
            echo
          } > release-notes.md

      - name: Upload the APKs
        if: steps.version.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-release-${{ steps.version.outputs.tag }}
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Publish the release
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -eu
          mapfile -t release_apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#release_apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi
          printf 'APKs:\n'
          printf '  %s\n' "${release_apks[@]}"
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} already points at ${existing}." >&2
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          fi
          git push origin "refs/tags/${RELEASE_TAG}"
          release_args=(
            "${RELEASE_TAG}"
            --verify-tag
            --title "${RELEASE_TITLE}"
            --notes-file release-notes.md
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}" "${release_apks[@]}"
